<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>XR Test</title>
    <script src="https://aframe.io"></script>
  </head>
  <body style="margin: 0; background: #000;">

    <!-- This is the fallback button that forces the browser prompt -->
    <button id="vbtn" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 9999; padding: 30px 60px; font-size: 24px; color: #fff; background: #22c55e; border: none; border-radius: 8px; cursor: pointer;">
      ENTER VR TEST
    </button>

    <!-- Super simple scene setup -->
    <a-scene vr-mode-ui="enterVRBtn: #vbtn">
      <a-sky color="#87CEEB"></a-sky>
      <a-plane color="#222" width="50" height="50" rotation="-90 0 0"></a-plane>
    </a-scene>

  </body>
</html>
