<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>WebXR Permission Test</title>
  <!-- Main A-Frame Library distributed via standard JSDelivr CDN -->
  <script src="https://aframe.io"></script>
</head>
<body style="margin: 0; background: #111827; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh;">

  <!-- A clean, prominent user-gesture button -->
  <button id="vr-btn" style="padding: 20px 40px; font-size: 20px; background-color: #10B981; color: white; border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); font-weight: bold;">
    Request Immersive Permission
  </button>

  <!-- The basic WebXR scene configured to listen for the button action -->
  <a-scene vr-mode-ui="enterVRBtn: #vr-btn">
    <a-sky color="#87CEEB"></a-sky>
    <a-plane color="#374151" width="100" height="100" rotation="-90 0 0"></a-plane>
  </a-scene>

</body>
</html>
